[project]
name = "ingest"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "en-core-web-sm==3.8.0",
    "httpx>=0.28.1",
    "numpy>=2.2.0",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "python-magic>=0.4.27",
    "rich>=15.0.0",
    "trafilatura>=2.0.0",
    "typer>=0.25.1",
    "unstructured[all-docs]>=0.22.28",
    "watchdog>=6.0.0",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
