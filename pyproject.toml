[project]
name = "ingest-viewer"
version = "0.2.0"
description = "Bifröst — 3D graph viewer + knowledge layer for the knowledge DB"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "numpy>=2.0",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.40",
    "scikit-learn>=1.5",
    "networkx>=3.4",
    "httpx>=0.28",
    "orjson>=3.10",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13.9",
    "skein-kg",
    "skry-kg",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
skein-kg = { path = "../skein-kg" }
skry-kg = { path = "../skry-kg" }
